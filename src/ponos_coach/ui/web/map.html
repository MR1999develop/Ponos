<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src ponos://app; style-src ponos://app 'unsafe-inline'; img-src data: blob: ponos://tiles; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<title>Map</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="MarkerCluster.css">
<link rel="stylesheet" href="MarkerCluster.Default.css">
<style>
:root { --map-bg: #e6e8eb; --map-fg: #1f2328; --map-panel: #ffffff; --cluster-bg: #1f2328; --cluster-fg: #ffffff; }
html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
#map { background: var(--map-bg); font: 12px system-ui, sans-serif; }
.leaflet-container { background: var(--map-bg); }
.leaflet-control-attribution { background: var(--map-panel); color: var(--map-fg); padding: 2px 6px; }
.leaflet-bar a, .leaflet-bar a:hover { background-color: var(--map-panel); color: var(--map-fg); border-bottom-color: var(--map-fg); }
.leaflet-container:focus-visible { outline: 2px solid var(--map-fg); outline-offset: -2px; }
.ponos-cluster div { box-sizing: border-box; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--cluster-fg); background: var(--cluster-bg); color: var(--cluster-fg); display: flex; align-items: center; justify-content: center; font: 600 13px system-ui, sans-serif; }
.ponos-cluster span { line-height: 1; }
</style>
</head>
<body>
<div id="map" role="application"></div>
<script src="qwebchannel.js"></script>
<script src="leaflet.js"></script>
<script src="leaflet.markercluster.js"></script>
<script src="map.js"></script>
</body>
</html>
