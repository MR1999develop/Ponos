name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nox:
    name: nox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60  # the Windows tests alone take about 27 minutes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # System libraries for Qt and QtWebEngine in offscreen mode.
      - name: System packages for Qt and QtWebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libopengl0 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxcursor1 libasound2t64 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: All the mandatory checks
        run: uv run --locked nox
